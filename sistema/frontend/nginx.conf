# Configuración de nginx para el frontend en producción (la copia Dockerfile.prod).

server {
    # Escucha HTTP dentro del contenedor; docker-compose.prod.yml publica el puerto.
    listen 80;
    # Acepta cualquier nombre de servidor (dominio o IP).
    server_name _;

    # Carpeta con los archivos que generó "npm run build".
    root /usr/share/nginx/html;
    index index.html;

    # No muestra la versión de nginx en las respuestas de error.
    server_tokens off;

    # Cabeceras de seguridad para todas las respuestas:
    # nosniff: el navegador no adivina tipos de archivo.
    add_header X-Content-Type-Options "nosniff" always;
    # DENY: ninguna otra página puede mostrar el sistema dentro de un iframe.
    add_header X-Frame-Options "DENY" always;
    # No envía la dirección completa a otros sitios.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Solo carga código, estilos e imágenes del mismo servidor; la API también es del mismo origen.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Reenvía la API al contenedor del backend por la red interna de Docker.
    location /api/ {
        proxy_pass http://backend:8000;
        # Conserva el nombre del servidor que pidió el navegador.
        proxy_set_header Host $host;
        # Reemplaza (no agrega) la IP del cliente: así nadie puede falsificarla y el
        # límite de intentos de login cuenta por la IP real de cada persona.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Limita el tamaño de los JSON recibidos.
        client_max_body_size 1m;
    }

    # Archivos con huella en el nombre (assets/index-abc123.js): se pueden guardar en caché un año.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # add_header dentro de un location reemplaza los de server: se repiten los de seguridad.
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Rutas de React (/productores, /usuarios...): si no es un archivo, entrega index.html.
    location / {
        try_files $uri $uri/ /index.html;
        # index.html no se guarda en caché para que cada despliegue se vea de inmediato.
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }
}
